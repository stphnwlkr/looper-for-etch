name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: PHP syntax and updater tests
        run: |
          php -l looper-for-etch.php
          php -l query-support.php
          php -l native-queries.php
          php -l preferences.php
          php -l updater.php
          php tests/updater-test.php
      - run: python3 tests/release-test.py
      - run: python3 scripts/build-release.py "$(node -p 'require("./package.json").version')"
